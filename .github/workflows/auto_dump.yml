name: Auto Decrypt and Il2Cpp Dump

on:
  workflow_dispatch: # Manuel olarak butona basıp başlatmak için

jobs:
  dump_process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0' # Güncel Il2CppDumper'lar için .NET 8.0 gerekiyor

      - name: Download Latest Il2CppDumper
        run: |
          # Perfare'nin en güncel dumper sürümünü GitHub API'den otomatik çekiyoruz
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest | jq -r '.assets[] | select(.name | contains("linux")) | .browser_download_url')
          if [ -z "$LATEST_RELEASE" ]; then
            # Eğer Linux özel build bulunamazsa generic olanı indiriyoruz
            LATEST_RELEASE=$(curl -s https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest | jq -r '.assets[0].browser_download_url')
          fi
          curl -L -o Il2CppDumper.zip "$LATEST_RELEASE"
          unzip Il2CppDumper.zip -d dumper_cli
          chmod +x dumper_cli/Il2CppDumper

      - name: Verify Input Files
        run: |
          # Depoda dosyaların varlığını kontrol ediyoruz
          if [ ! -f "libil2cpp.so" ] || [ ! -f "global-metadata.dat" ]; then
            echo "::error::HATA: Deponun ana dizininde 'libil2cpp.so' veya 'global-metadata.dat' bulunamadı!"
            exit 1
          fi

      - name: Auto Decrypt & Execute Dump
        run: |
          # Not: Eğer oyun özel bir XOR veya Header şifrelemesi kullanıyorsa, 
          # dumper_cli/config.json içindeki "SymmetricKey" veya "XORKey" alanları burada otomatik manipüle edilebilir.
          
          echo "Dumping işlemi başlatılıyor..."
          cd dumper_cli
          ./Il2CppDumper ../libil2cpp.so ../global-metadata.dat ../output/ || true

      - name: Upload Output (dump.cs)
        uses: actions/upload-artifact@v4
        with:
          name: Il2Cpp-Dump-Results
          path: |
            output/dump.cs
            output/script.json
            output/stringliteral.json
            
